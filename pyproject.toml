[project]
name = "geppetto"
version = "0.0.0"
description = "Geppetto monorepo kökü (uv workspace). Marangozhaneler için bulut SaaS."
requires-python = ">=3.12"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/geppetto-domain",
  "packages/geppetto-solver",
  "packages/geppetto-contracts",
  "packages/geppetto-ingest",
  "packages/geppetto-export",
  "apps/api",
  "apps/worker",
]

[tool.uv.sources]
geppetto-domain = { workspace = true }
geppetto-solver = { workspace = true }
geppetto-contracts = { workspace = true }
geppetto-ingest = { workspace = true }
geppetto-export = { workspace = true }
geppetto-api = { workspace = true }
geppetto-worker = { workspace = true }

[dependency-groups]
dev = [
  "geppetto-domain",
  "geppetto-solver",
  "geppetto-contracts",
  "geppetto-ingest",
  "geppetto-export",
  "geppetto-api",
  "geppetto-worker",
  "ruff>=0.13",
  "mypy>=1.17",
  "pytest>=8.3",
  "pytest-asyncio>=1.1",
  "hypothesis>=6.130",
  "import-linter>=2.3",
  "testcontainers[postgres]>=4.10",
  "psycopg[binary]>=3.2",
  "httpx2>=2.13.0",
]

# ---------------------------------------------------------------------------
# ruff — tüm workspace için tek ayar
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
  "packages/geppetto-domain/src",
  "packages/geppetto-solver/src",
  "packages/geppetto-contracts/src",
  "packages/geppetto-ingest/src",
  "packages/geppetto-export/src",
  "apps/api/src",
  "apps/worker/src",
]
extend-exclude = ["apps/web", "apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "TID", "RUF", "SIM", "PL"]
# RUF001-003: Türkçe docstring/metin proje kuralı (CLAUDE.md); "ambiguous unicode" yanlış pozitif.
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
  "geppetto_domain",
  "geppetto_solver",
  "geppetto_contracts",
  "geppetto_ingest",
  "geppetto_export",
  "geppetto_api",
  "geppetto_worker",
]

# Saf çekirdek: domain ve solver içinde saat, ortam ve IO yasak (ADR-0001, ADR-0011; lessons T11).
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["PLR", "S", "TID251", "PLC0415", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "domain/solver içinde saat yok; zaman parametredir (ADR-0011)"
"datetime.datetime.utcnow".msg = "domain/solver içinde saat yok; zaman parametredir (ADR-0011)"
"datetime.date.today".msg = "domain/solver içinde saat yok; zaman parametredir (ADR-0011)"
"time.time".msg = "domain/solver içinde saat yok; zaman parametredir (ADR-0011)"
"os.environ".msg = "domain/solver içinde ortam okunmaz (ADR-0001)"
"os.getenv".msg = "domain/solver içinde ortam okunmaz (ADR-0001)"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = [
  "packages/geppetto-domain/src",
  "packages/geppetto-solver/src",
  "packages/geppetto-contracts/src",
  "packages/geppetto-ingest/src",
  "packages/geppetto-export/src",
  "apps/api/src",
  "apps/worker/src",
]
mypy_path = [
  "packages/geppetto-domain/src",
  "packages/geppetto-solver/src",
  "packages/geppetto-contracts/src",
  "packages/geppetto-ingest/src",
  "packages/geppetto-export/src",
  "apps/api/src",
  "apps/worker/src",
]
namespace_packages = true
explicit_package_bases = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest — kökten tek komut, tüm paket ve uygulama testleri
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = [
  "packages/geppetto-domain/tests",
  "packages/geppetto-solver/tests",
  "packages/geppetto-contracts/tests",
  "packages/geppetto-ingest/tests",
  "packages/geppetto-export/tests",
  "apps/api/tests",
  "apps/worker/tests",
  "tests",
]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
markers = [
  "rls: tenant izolasyon testleri (Postgres testcontainer, uygulama rolü)",
  "golden: golden set koşuları (doluluk tablosu)",
  "slow: gecelik koşuya ait uzun testler",
]
xfail_strict = true

# ---------------------------------------------------------------------------
# import-linter — bağımlılık yönü (ADR-0001, ADR-0011; repo-structure.md)
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
  "geppetto_domain",
  "geppetto_solver",
  "geppetto_contracts",
  "geppetto_ingest",
  "geppetto_export",
  "geppetto_api",
  "geppetto_worker",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Katman yönü: apps -> ingest/export/contracts -> domain"
type = "layers"
layers = [
  "geppetto_api | geppetto_worker",
  "geppetto_ingest | geppetto_export",
  "geppetto_contracts",
  "geppetto_domain",
]

[[tool.importlinter.contracts]]
name = "Solver hiçbir iç paketi import etmez (ADR-0011)"
type = "forbidden"
source_modules = ["geppetto_solver"]
forbidden_modules = [
  "geppetto_domain",
  "geppetto_contracts",
  "geppetto_ingest",
  "geppetto_export",
  "geppetto_api",
  "geppetto_worker",
]

[[tool.importlinter.contracts]]
name = "Yalnızca worker solver'ı çağırır"
type = "forbidden"
source_modules = [
  "geppetto_domain",
  "geppetto_contracts",
  "geppetto_ingest",
  "geppetto_export",
  "geppetto_api",
]
forbidden_modules = ["geppetto_solver"]

[[tool.importlinter.contracts]]
name = "Saf çekirdek IO kütüphanesi bilmez (ADR-0001)"
type = "forbidden"
source_modules = ["geppetto_domain", "geppetto_solver"]
forbidden_modules = [
  "sqlalchemy",
  "alembic",
  "asyncpg",
  "psycopg",
  "fastapi",
  "starlette",
  "httpx",
  "requests",
  "boto3",
  "botocore",
  "arq",
  "redis",
  "aiofiles",
]

[[tool.importlinter.contracts]]
name = "Adaptör paketleri DB/HTTP/S3 bilmez (architecture-overview.md §3)"
type = "forbidden"
source_modules = ["geppetto_contracts", "geppetto_ingest", "geppetto_export"]
forbidden_modules = [
  "sqlalchemy",
  "alembic",
  "asyncpg",
  "psycopg",
  "fastapi",
  "starlette",
  "httpx",
  "requests",
  "boto3",
  "botocore",
  "arq",
  "redis",
]

[[tool.importlinter.contracts]]
name = "Worker HTTP bilmez"
type = "forbidden"
source_modules = ["geppetto_worker"]
forbidden_modules = ["fastapi", "starlette", "geppetto_api"]
