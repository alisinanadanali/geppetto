[project]
name = "geppetto-api"
version = "0.1.0"
description = "FastAPI uygulaması: HTTP, auth, RLS middleware, repository'ler, port implementasyonları."
requires-python = ">=3.12"
dependencies = [
  "geppetto-contracts",
  "geppetto-domain",
  "geppetto-ingest",
  "geppetto-export",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "sqlalchemy[asyncio]>=2.0.41",
  "asyncpg>=0.30",
  "alembic>=1.16",
  "pydantic-settings>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geppetto_api"]
