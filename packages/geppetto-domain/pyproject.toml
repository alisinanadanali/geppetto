[project]
name = "geppetto-domain"
version = "0.1.0"
description = "Saf domain çekirdeği: ölçü kuralları, stok projeksiyonu, varlık tipleri. IO yok (ADR-0001)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geppetto_domain"]
