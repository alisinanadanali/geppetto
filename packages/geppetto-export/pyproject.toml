[project]
name = "geppetto-export"
version = "0.1.0"
description = "Çıkış adaptörleri: PDF kesim planı, etiket, R12 DXF, CSV (ADR-0013)."
requires-python = ">=3.12"
dependencies = [
  "geppetto-contracts",
  "geppetto-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geppetto_export"]
