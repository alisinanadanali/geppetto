[project]
name = "geppetto-solver"
version = "0.1.0"
description = "Saf, sürümlü giyotin kesim optimizasyon paketi: optimize(request) -> result (ADR-0011)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11",
]

[project.optional-dependencies]
# OR-Tools yalnızca golden set kıyası için; üretim bağımlılığı değildir (ADR-0011, V6).
ortools = ["ortools>=9.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geppetto_solver"]
